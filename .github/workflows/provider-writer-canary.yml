name: Isolated AI Provider Writer-Stage Canaries

on:
  push:
    branches:
      - integration/provider-fixes-on-current-main-2026-10-10
    paths:
      - ".github/workflows/provider-writer-canary.yml"
      - "scripts/provider-writer-canary.mjs"
      - "scripts/trendforge-writer-engine.mjs"

permissions:
  contents: read

jobs:
  writer-canary:
    if: github.event.head_commit.message == 'Run isolated provider writer canaries'
    strategy:
      fail-fast: false
      matrix:
        provider: [Groq, Gemini, OpenRouter, Cohere]
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
      COHERE_MODEL: command-r-plus-08-2024
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      PROVIDER_WRITER_TARGET: ${{ matrix.provider }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Run one bounded ${{ matrix.provider }} writer-stage request
        run: node scripts/provider-writer-canary.mjs
