name: TrendForge Tools QA

on:
  pull_request:
    paths:
      - "app/tools/**"
      - "tests/test-tools-suite.ts"
      - "scripts/candidate-source-alignment.mjs"
      - "scripts/ai-provider-router.mjs"
      - "scripts/test-ai-provider-router.mjs"
      - "scripts/test-candidate-source-alignment.mjs"
      - "scripts/pre-writer-pipeline.mjs"
      - "package.json"
      - ".github/workflows/tools-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tools-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run candidate/source alignment regression tests
        run: node scripts/test-candidate-source-alignment.mjs
      - name: Run deterministic AI provider routing tests
        run: npm run ai-router:test
      - name: Run mocked provider contract tests
        run: npm run provider-contracts:test
      - name: Run consolidated tools QA
        run: npm run tools:test
      - name: Production build
        run: npm run build
