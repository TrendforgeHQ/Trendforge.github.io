name: TrendForge Tools QA

on:
  pull_request:
    paths:
      - "app/tools/**"
      - "tests/test-tools-suite.ts"
      - "package.json"
      - ".github/workflows/tools-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tools-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run consolidated tools QA
        run: npm run tools:test
      - name: Production build
        run: npm run build
