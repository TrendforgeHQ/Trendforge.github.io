name: One-shot OpenRouter Provider Smoke Test

on:
  push:
    branches:
      - fix/provider-response-contracts-2026-10-09
    paths:
      - ".github/workflows/provider-smoke-one-shot.yml"
      - "scripts/provider-smoke-test.mjs"
      - "scripts/trendforge-writer-engine.mjs"
      - "scripts/test-provider-contracts.mjs"

permissions:
  contents: read

jobs:
  openrouter-smoke:
    if: github.event.head_commit.message == 'Re-run OpenRouter smoke test with error diagnostics'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_MODEL: openrouter/free
      PROVIDER_SMOKE_TARGET: OpenRouter
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Run one bounded OpenRouter response-contract request
        run: node scripts/provider-smoke-test.mjs
